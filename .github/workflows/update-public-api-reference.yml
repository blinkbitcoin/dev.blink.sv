name: Update Public API Reference

on:
  schedule:
    # Run at six every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even when the published schema hash matches
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-public-api-reference
  cancel-in-progress: false

jobs:
  update-public-api-reference:
    runs-on: ubuntu-latest

    steps:
      - uses: DeterminateSystems/nix-installer-action@v12
      - uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Checkout Blink
        uses: actions/checkout@v4
        with:
          repository: blinkbitcoin/blink-legacy
          path: blink

      - name: Checkout developer documentation
        uses: actions/checkout@v4
        with:
          path: dev.blink.sv
          ref: main

      - name: Determine whether the schema changed
        id: schema
        env:
          FORCE_UPDATE: ${{ inputs.force }}
        run: |
          node dev.blink.sv/scripts/public-api-reference-status.mjs \
            blink/core/api/src/graphql/public/schema.graphql \
            dev.blink.sv/static/public-api-reference.schema.sha256 \
            "$FORCE_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.schema.outputs.changed == 'true'
        working-directory: dev.blink.sv
        run: nix-shell -p yarn --run "yarn install --frozen-lockfile"

      - name: Test API reference generator
        if: steps.schema.outputs.changed == 'true'
        working-directory: dev.blink.sv
        run: nix-shell -p yarn --run "yarn test"

      - name: Generate public API reference
        if: steps.schema.outputs.changed == 'true'
        working-directory: blink
        run: |
          node ../dev.blink.sv/scripts/generate-public-api-reference.mjs \
            core/api/src/graphql/public/schema.graphql \
            ../dev.blink.sv/scripts/spectaql/spectaql-config-public-api.yml \
            ../dev.blink.sv/static/public-api-reference.html \
            ../dev.blink.sv/static/public-api-reference.schema.sha256 \

      - name: Build documentation site
        if: steps.schema.outputs.changed == 'true'
        working-directory: dev.blink.sv
        run: nix-shell -p yarn --run "yarn build"

      - name: Commit public API reference
        if: steps.schema.outputs.changed == 'true'
        working-directory: dev.blink.sv
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            static/public-api-reference.html \
            static/public-api-reference.schema.sha256
          short_commit_hash=$(git -C ../blink rev-parse --short=7 HEAD)
          git commit -m "docs: public api reference update to blink commit $short_commit_hash"
          git push origin main

      - name: Deploy to GitHub Pages
        if: steps.schema.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dev.blink.sv/build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
